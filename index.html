<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OT xavfsizligi test</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e2e2dd;--accent:#2f6fdb;--ok:#2e8b57;--bad:#c0392b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b19;--card:#262623;--text:#eaeae6;--muted:#9a9a93;--line:#3a3a36;--accent:#6fa0ff;--ok:#4cc27f;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#1b1b19;--card:#262623;--text:#eaeae6;--muted:#9a9a93;--line:#3a3a36;--accent:#6fa0ff;--ok:#4cc27f;--bad:#ff7a6b}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.35rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
label{font-size:.9rem;color:var(--muted)}
select,button,input[type=text]{font:inherit}
select,input[type=text]{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);max-width:100%}
select{flex:1 1 180px}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;min-height:42px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{min-height:34px;padding:6px 10px;font-size:.85rem}
button:disabled{opacity:.5;cursor:default}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tabs button{padding:9px 4px;font-size:.9rem}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.q{font-size:1.08rem;font-weight:600;margin:0 0 12px;word-break:break-word}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;line-height:1.4}
.opt .k{display:inline-block;min-width:22px;font-weight:700;color:var(--accent)}
.opt.ok{border-color:var(--ok);background:rgba(46,139,87,.14)}
.opt.bad{border-color:var(--bad);background:rgba(192,57,43,.14)}
.opt:disabled{cursor:default;opacity:1}
.note{margin-top:10px;font-size:.95rem;min-height:1.4em}
.ok-t{color:var(--ok);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.stat{font-size:2.2rem;font-weight:700;margin:6px 0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small-t{font-size:.85rem}
.wrongitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.wrongitem:last-child{border-bottom:0}
.kbd{font-size:.8rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>OT xavfsizligi test</h1>

  <div class="tabs">
    <button id="m-practice" class="on" onclick="setMode('practice')">Mashq</button>
    <button id="m-exam" onclick="setMode('exam')">Imtihon</button>
    <button id="m-wrong" onclick="setMode('wrong')">Xatolar</button>
    <button id="m-browse" onclick="setMode('browse')">Ro‘yxat</button>
  </div>

  <div class="card" id="setup">
    <div class="row">
      <label for="topic" style="min-width:60px">Bo‘lim:</label>
      <select id="topic" onchange="onTopic()"></select>
    </div>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <label class="row" style="gap:6px;color:var(--text)"><input type="checkbox" id="shuf" checked> Variantlarni aralashtirish</label>
      <button class="primary" onclick="start()" id="startBtn">Boshlash</button>
    </div>
    <div class="row between small-t muted" style="margin-top:12px">
      <span id="stats"></span>
      <button class="small" onclick="resetProgress()">Tozalash</button>
    </div>
  </div>

  <div id="play" class="card hidden">
    <div class="meta"><span id="pos"></span><span id="score"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div class="note" id="note"></div>
    <div class="row between" style="margin-top:12px">
      <span class="muted small-t" id="topicTag"></span>
      <button class="primary hidden" id="nextBtn" onclick="next()">Keyingi</button>
    </div>
    <div class="kbd">Klaviatura: 1–4 javob, Enter keyingi</div>
  </div>

  <div id="result" class="card hidden" style="text-align:center">
    <div class="muted">Natija</div>
    <div class="stat" id="resStat"></div>
    <div class="muted" id="resText"></div>
    <div id="resWrong" style="text-align:left;margin-top:14px"></div>
    <div class="row" style="justify-content:center;margin-top:16px">
      <button class="primary" onclick="backHome()">Bosh sahifa</button>
    </div>
  </div>

  <div id="browse" class="hidden">
    <div class="card"><input type="text" id="sq" placeholder="Kalit so‘z bo‘yicha qidirish..." oninput="renderBrowse()" style="width:100%"></div>
    <div id="list"></div>
  </div>
</div>

<script>
const QS = [{"id": 1, "q": "Operatsion tizimning asosiy vazifasi nima?", "o": ["Apparat resurslarini boshqarish va dasturlar uchun ishlash muhitini yaratish", "Faqat foydalanuvchi fayllarini arxivlash", "Tarmoq trafigini shifrlash va filtrlash", "Dasturlash tillari uchun kompilyator yaratish"], "c": 0, "t": "Umumiy"}, {"id": 2, "q": "Protsessor, xotira va qurilmalarni boshqaruvchi markaziy komponent qaysi?", "o": ["Yadro (kernel)", "Drayver", "Shell (buyruq qobig'i)", "BIOS"], "c": 0, "t": "Yuklash, TPM va ishonch"}, {"id": 3, "q": "Ilova yadrodan fayl ochish xizmatini qanday nazoratli yo‘l bilan so‘raydi?", "o": ["Tizim chaqiruvi (system call) orqali", "Ilovaning to'g'ridan-to'g'ri diskka yozishi orqali", "Drayverni qayta yuklash orqali", "Shell buyrug'ini xeshlash orqali"], "c": 0, "t": "Kriptografiya va xesh"}, {"id": 4, "q": "Qurilmaga xos buyruqlarni operatsion tizimga moslashtiruvchi dastur nima?", "o": ["Drayver", "Yadro (kernel)", "Kompilyator", "Fayl tizimi"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 5, "q": "Monolit yadro arxitekturasining xarakterli belgisi qaysi?", "o": ["Asosiy xizmatlar (fayl tizimi, drayverlar, xotira) yadro rejimida bitta katta kod bazasida ishlaydi", "Xizmatlar alohida foydalanuvchi jarayonlariga chiqarilib, xabar almashadi", "Yadro faqat ikkita tizim chaqiruvini bajaradi", "Barcha ilovalar yadro bilan bitta jarayon sifatida ishlaydi"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 6, "q": "Mikroyadro yondashuvida ayrim xizmatlarni alohida jarayonlarga chiqarish nimaga xizmat qiladi?", "o": ["Yadro hajmini kamaytirish va xizmat nosozligini izolyatsiyalash", "Yadro hajmini oshirish va tezlikni ko'paytirish", "Barcha xizmatlarni bitta jarayonda birlashtirish", "Drayverlarni foydalanuvchidan yashirish"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 7, "q": "Foydalanuvchi rejimi va yadro rejimi nima uchun ajratiladi?", "o": ["Ilova xatosi yoki zararli kodi yadro va apparatga to'g'ridan-to'g'ri ta'sir qilmasligi uchun", "Ilova tezligini oshirish uchun", "Xotirani tejash uchun", "Foydalanuvchi interfeysini soddalashtirish uchun"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 8, "q": "Tunda navbatga qo‘yilgan hisobotlarning foydalanuvchi ishtirokisiz bajarilishi qaysi rejimga misol?", "o": ["Paketli ishlov berish rejimi", "Vaqtni taqsimlash rejimiga", "Real vaqt rejimiga", "Interaktiv rejimga"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 9, "q": "Vaqtni taqsimlash rejimida protsessor qanday ishlaydi?", "o": ["Har bir foydalanuvchi yoki jarayonga qisqa vaqt kvanti ajratib, navbatma-navbat almashtiradi", "Bitta jarayonni tugaguniga qadar to'xtatmasdan bajaradi", "Faqat yuqori ustuvor jarayonlarni bajarib, qolganlarini o'chiradi", "Jarayonlarni tasodifiy tartibda xotiradan o'chirib turadi"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 10, "q": "Bitta protsessor yadrosidagi navbatlash va ko‘p yadrodagi parallel ishlash qanday farqlanadi?", "o": ["Bitta yadroda navbatma-navbat (psevdoparallel), ko'p yadroda haqiqiy parallel bajariladi", "Bitta yadroda haqiqiy parallel, ko'p yadroda faqat navbatma-navbat bajariladi", "Farqi yo'q, ikkalasi ham bir xil ishlaydi", "Bitta yadro ham, ko'p yadro ham faqat bitta dasturni ishga tushiradi"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 11, "q": "Qat’iy real vaqt tizimida belgilangan muddatning buzilishi nimani anglatadi?", "o": ["Tizim xatosi hisoblanadi va jiddiy oqibatga olib kelishi mumkin", "Faqat tizim sekinlashadi, oqibati yo'q", "Muddat buzilishi odatiy hodisa, e'tibor berilmaydi", "Foydalanuvchiga ogohlantirish chiqadi va tizim davom etadi"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 12, "q": "Bir foydalanuvchili va ko‘p vazifali tasniflar haqida qaysi fikr to‘g‘ri?", "o": ["Ular turli mezonlarga asoslanadi: bir foydalanuvchili tizim ham ko'p vazifali bo'lishi mumkin", "Bir foydalanuvchili tizim hech qachon ko'p vazifali bo'la olmaydi", "Ular bir xil tushuncha, farqi yo'q", "Ko'p vazifali tizim faqat ko'p foydalanuvchili bo'ladi"], "c": 0, "t": "Umumiy"}, {"id": 13, "q": "Linux yadrosi, kutubxonalar va boshqaruv vositalari yig‘indisi nima deb ataladi?", "o": ["Linux distributivi", "Linux yadrosi", "Linux qobig'i (shell)", "Linux drayveri"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 14, "q": "Universitet serveri uchun operatsion tizim tanlashda qaysi mezonlar muhim?", "o": ["Xavfsizlik va yangilanishlar, barqarorlik, xizmatlarga moslik, boshqaruv qulayligi", "Faqat dizayn va ranglar sxemasi", "Faqat eng arzon narx va reklama ko'rsatkichi", "Faqat o'yinlar va multimedia qo'llab-quvvatlashi"], "c": 0, "t": "Zaxira, tiklash va hodisa"}, {"id": 15, "q": "Operatsion tizimning ochiq kodli bo‘lishi xavfsizlikni qanday belgilaydi?", "o": ["O'z-o'zidan kafolat bermaydi: kodni tekshirish mumkin, lekin yangilash va sozlash muhim", "Doim to'liq xavfsiz bo'ladi, chunki kodi hammaga ochiq", "Doim xavfsiz emas, chunki kodni hamma ko'ra olishi zaiflik hisoblanadi", "Xavfsizlikka umuman ta'sir qilmaydi"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 16, "q": "Talabaning baholarini begona shaxs o‘qishi birinchi navbatda qaysi xususiyatni buzadi?", "o": ["Maxfiylik", "Yaxlitlik", "Mavjudlik", "Hisobdorlik"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 17, "q": "Baholar jadvalini ruxsatsiz o‘zgartirish qaysi xususiyatni buzadi?", "o": ["Yaxlitlik", "Maxfiylik", "Mavjudlik", "Autentifikatsiya"], "c": 0, "t": "Autentifikatsiya va avtorizatsiya"}, {"id": 18, "q": "Elektron ta’lim xizmati kerakli paytda ishlamasligi qaysi talabning buzilishidir?", "o": ["Mavjudlik", "Maxfiylik", "Yaxlitlik", "Inkor etmaslik"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 19, "q": "Minimal imtiyoz tamoyili qanday talabni bildiradi?", "o": ["Foydalanuvchi yoki jarayonga faqat vazifasi uchun zarur huquqlar beriladi", "Foydalanuvchiga barcha resurslarga to'liq huquq beriladi", "Foydalanuvchi parolini muntazam almashtirishi kerak", "Har bir foydalanuvchi faqat administrator huquqida ishlaydi"], "c": 0, "t": "Autentifikatsiya va avtorizatsiya"}, {"id": 20, "q": "Yangi xizmatda zarur bo‘lmagan kirishning avvaldan yopilishi qaysi tamoyilga mos?", "o": ["Xavfsiz standart sozlamalar (standart bo'yicha rad etish)", "Minimal imtiyoz tamoyili", "Qatlamli himoya tamoyili", "Vazifalarni ajratish"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 21, "q": "To‘liq vositachilik tamoyili nimani talab qiladi?", "o": ["Obyektga har bir murojaat har safar ruxsat uchun tekshirilishini", "Obyektga faqat birinchi murojaatda ruxsat tekshirilishini", "Ruxsat faqat tizimga kirishda bir marta tekshirilishini", "Faqat administrator murojaatlari tekshirilishini"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 22, "q": "Nusxa yaratish va uni butunlay o‘chirish huquqlarini turli rollarga berish qaysi tamoyil?", "o": ["Vazifalarni ajratish", "Minimal imtiyoz", "Qatlamli himoya", "To'liq vositachilik"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 23, "q": "Qatlamli himoyaning afzalligi nimada?", "o": ["Bitta qatlam yengilsa ham keyingi qatlamlar himoyani davom ettiradi", "Faqat bitta kuchli qatlam yetarli bo'ladi", "Himoya tezligi oshadi, qatlamlar esa sarflanmaydi", "Barcha qatlamlar bir vaqtda buziladi"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 24, "q": "Xavfsizlik siyosati va himoya mexanizmi o‘rtasidagi farq qaysi?", "o": ["Siyosat nima ruxsat etilganini belgilaydi, mexanizm uni amalga oshiruvchi vosita", "Siyosat — dasturiy vosita, mexanizm — qoidalar hujjati", "Ular bir xil tushuncha", "Mexanizm ruxsat etilganini belgilaydi, siyosat uni bajaradi"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 25, "q": "Kirishni boshqarishda subyektga qaysi misol mos?", "o": ["Foydalanuvchi yoki jarayon", "Fayl yoki katalog", "Printer yoki port", "Ma'lumotlar bazasi jadvali"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 26, "q": "Login kiritilgandan keyin parolning tekshirilishi qaysi jarayon?", "o": ["Autentifikatsiya", "Identifikatsiya", "Avtorizatsiya", "Audit"], "c": 0, "t": "Autentifikatsiya va avtorizatsiya"}, {"id": 27, "q": "Oddiy xeshning 93, "q": "Ruxsatli ilovalar siyosati qanday imkoniyatni cheklaydi?", "o": ["Tasdiqlanmagan kod bajarilishini", "Barcha kod bajarilishini", "Faqat tarmoq trafigini", "Faqat fayl nomlarini"], "c": 0, "t": "Yuklash, TPM va ishonch"}, {"id": 294, "q": "Virtual mashina va konteynerning xarakterli farqi qaysi?", "o": ["VM o'z OT yadrosi bilan virtual apparatda ishlaydi, konteyner esa mezbon yadrosini umumiy ishlatadi", "VM mezbon yadrosini umumiy ishlatadi, konteyner o'z yadrosi bilan", "Ularning farqi yo'q", "Ikkalasi ham apparatsiz ishlaydi"], "c": 0, "t": "Yadro va jarayonlar"}, {"id": 295, "q": "Konteynerga mezbon katalogiga cheklanmagan yozish berilsa, nima yuz beradi?", "o": ["Konteynerdan mezbon fayllarini o'zgartirish va tizimni buzish imkoni paydo bo'ladi", "Konteyner izolyatsiyasi kuchayadi", "Hech narsa o'zgarmaydi", "Faqat jurnal hajmi o'zgaradi"], "c": 0, "t": "Virtualizatsiya va sandbox"}, {"id": 296, "q": "Sandbox siyosati nimaga qarab belgilanadi?", "o": ["Ilovaning vazifasi va minimal zarur resurslariga qarab", "Foydalanuvchi ismiga qarab", "Dastur rangiga qarab", "Tasodifiy tanlovga qarab"], "c": 0, "t": "Virtualizatsiya va sandbox"}, {"id": 297, "q": "Zero Trust yondashuviga qaysi fikr mos?", "o": ["Joylashuv ishonch bermaydi; har bir so'rov foydalanuvchi, qurilma va siyosat bo'yicha tekshiriladi", "Ichki tarmoqdagi hamma qurilmaga avtomatik ishoniladi", "Faqat tashqi tarmoq so'rovlari tekshiriladi", "Foydalanuvchi bir marta kirgach qayta tekshirilmaydi"], "c": 0, "t": "Xavfsizlik tamoyillari"}, {"id": 298, "q": "Xotira xavfsizligiga yo‘naltirilgan dasturlash usuli qaysi muammoni avtomatik hal qilmaydi?", "o": ["Mantiqiy xatolar, noto'g'ri sozlamalar va autentifikatsiya zaifliklarini", "Barcha zaifliklarni", "Buffer overflow xatolarini", "Use-after-free xatolarini"], "c": 0, "t": "Autentifikatsiya va avtorizatsiya"}, {"id": 299, "q": "Himoya funksiyasi mavjudligi va uning faol holati nega alohida tekshiriladi?", "o": ["Funksiya mavjud bo'lishi mumkin, lekin o'chirilgan yoki noto'g'ri sozlangan bo'lishi mumkin", "Chunki funksiya mavjud bo'lsa, doim faol bo'ladi", "Chunki u avtomatik yoqiladi", "Chunki tekshirish talab etilmaydi"], "c": 0, "t": "Umumiy"}, {"id": 300, "q": "Yangi himoya mexanizmini bosqichli joriy qilishning afzalligi qaysi?", "o": ["Xatolarni erta aniqlash, ta'sirni cheklash va qaytarish imkoni", "Xarajatni oshirish", "Barcha foydalanuvchilarga bir vaqtda ta'sir qilish", "Jarayonni murakkablashtirish"], "c": 0, "t": "Yadro va jarayonlar"}];
const LET = ['A','B','C','D'];
const KEY = 'ot_quiz_v2';
let progress = load();
let mode = 'practice', pool = [], idx = 0, score = 0, answered = false, cur = null, missed = [];

const $ = id => document.getElementById(id);

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.wrong && d.seen) return d; }catch(e){}
  return { wrong: [], seen: {} };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function init(){
  const topics = [...new Set(QS.map(q=>q.t))];
  $('topic').innerHTML = '<option value="">Barcha bo‘limlar (' + QS.length + ')</option>' +
    topics.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)} (${QS.filter(q=>q.t===t).length})</option>`).join('');
  renderStats();
  setMode('practice');
}
function onTopic(){ renderStats(); if(mode==='browse') renderBrowse(); }

function renderStats(){
  let seen = 0, right = 0;
  for(const id in progress.seen){ seen += progress.seen[id][1]; right += progress.seen[id][0]; }
  const pct = seen ? Math.round(right/seen*100) : 0;
  $('stats').textContent = `Jami: ${seen} javob · ${pct}% to‘g‘ri · xato savollar: ${progress.wrong.length}`;
}

function setMode(m){
  mode = m;
  ['practice','exam','wrong','browse'].forEach(x=>$('m-'+x).classList.toggle('on', x===m));
  const isBrowse = m==='browse';
  $('browse').classList.toggle('hidden', !isBrowse);
  $('setup').classList.toggle('hidden', isBrowse);
  $('play').classList.add('hidden'); $('result').classList.add('hidden');
  if(isBrowse) renderBrowse();
  else { $('setup').classList.remove('hidden'); $('startBtn').textContent = mode==='wrong' ? 'Xatolarni mashq qilish' : 'Boshlash'; }
}
function backHome(){ setMode(mode==='browse'?'practice':mode); renderStats(); }

function filtered(){
  const t = $('topic').value;
  return QS.filter(q => !t || q.t===t);
}

function start(){
  let p = filtered();
  if(mode==='wrong') p = p.filter(q => progress.wrong.includes(q.id));
  if(p.length===0){ alert(mode==='wrong' ? 'Xato savollar yo‘q.' : 'Savol topilmadi.'); return; }
  p = shuffle(p);
  if(mode==='exam') p = p.slice(0,30);
  pool = p; idx = 0; score = 0; missed = [];
  $('setup').classList.add('hidden'); $('result').classList.add('hidden');
  $('play').classList.remove('hidden');
  show();
}

function show(){
  if(idx >= pool.length){ finish(); return; }
  answered = false;
  cur = pool[idx];
  cur.perm = $('shuf').checked ? shuffle([0,1,2,3]) : [0,1,2,3];
  $('pos').textContent = (idx+1) + ' / ' + pool.length;
  $('score').textContent = 'To‘g‘ri: ' + score;
  $('prog').style.width = (idx/pool.length*100) + '%';
  $('qtext').textContent = cur.q;
  $('topicTag').textContent = cur.t;
  $('note').textContent = '';
  $('nextBtn').classList.add('hidden');
  const box = $('opts'); box.innerHTML = '';
  cur.perm.forEach((orig, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="k">' + LET[i] + ')</span> ' + escapeHtml(cur.o[orig]);
    b.onclick = () => pick(i);
    box.appendChild(b);
  });
}

function pick(i){
  if(answered) return;
  answered = true;
  const btns = $('opts').children;
  const correctIdx = cur.perm.indexOf(cur.c);
  const ok = i === correctIdx;
  const rec = progress.seen[cur.id] || [0,0];
  rec[1]++; if(ok){ rec[0]++; score++; }
  progress.seen[cur.id] = rec;
  if(ok){ progress.wrong = progress.wrong.filter(x => x !== cur.id); }
  else { if(!progress.wrong.includes(cur.id)) progress.wrong.push(cur.id); missed.push(cur); }
  save();
  btns[correctIdx].classList.add('ok');
  if(!ok) btns[i].classList.add('bad');
  for(const b of btns) b.disabled = true;
  $('note').innerHTML = ok
    ? '<span class="ok-t">To‘g‘ri!</span>'
    : '<span class="bad-t">Noto‘g‘ri.</span> To‘g‘ri javob: <b>' + LET[correctIdx] + ') ' + escapeHtml(cur.o[cur.c]) + '</b>';
  $('score').textContent = 'To‘g‘ri: ' + score;
  $('nextBtn').textContent = idx+1 < pool.length ? 'Keyingi' : 'Yakunlash';
  $('nextBtn').classList.remove('hidden');
}

function next(){ idx++; show(); }

function finish(){
  $('play').classList.add('hidden');
  $('result').classList.remove('hidden');
  const pct = Math.round(score/pool.length*100);
  $('resStat').textContent = pct + '%';
  $('resText').textContent = score + ' / ' + pool.length + ' to‘g‘ri javob';
  $('resWrong').innerHTML = missed.length
    ? '<div class="muted small-t" style="margin-bottom:6px">Adashgan savollar:</div>' +
      missed.map(q => `<div class="wrongitem"><b>#${q.id}.</b> ${escapeHtml(q.q)}<div class="ok-t small-t">✓ ${LET[q.c]}) ${escapeHtml(q.o[q.c])}</div></div>`).join('')
    : '<div class="ok-t" style="text-align:center">Hammasi to‘g‘ri!</div>';
  renderStats();
}

function resetProgress(){
  if(!confirm('Barcha statistika va xato savollar o‘chirilsinmi?')) return;
  progress = { wrong: [], seen: {} }; save(); renderStats();
}

function renderBrowse(){
  const kw = $('sq').value.trim().toLowerCase();
  const list = filtered().filter(q => !kw || (q.q + ' ' + q.o.join(' ')).toLowerCase().includes(kw));
  $('list').innerHTML = list.map(q => `
    <div class="card">
      <div class="muted small-t">#${q.id} · ${escapeHtml(q.t)}</div>
      <div class="q" style="margin:6px 0 8px">${escapeHtml(q.q)}</div>
      ${q.o.map((o,i)=>`<div class="${i===q.c?'ok-t':''}">${LET[i]}) ${escapeHtml(o)}${i===q.c?' ✓':''}</div>`).join('')}
    </div>`).join('') || '<div class="card muted">Hech narsa topilmadi.</div>';
}

document.addEventListener('keydown', e => {
  if($('play').classList.contains('hidden')) return;
  if(e.key>='1' && e.key<='4'){ const b = $('opts').children[+e.key-1]; if(b) b.click(); }
  if(e.key==='Enter' && answered) next();
});

init();
</script>
</body>
</html>
